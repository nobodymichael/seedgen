<!DOCTYPE html>
<html lang="pl" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SeedGen — Michał Plata</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style>
        body { font-family: 'Inter', sans-serif; }
        .font-mono { font-family: 'JetBrains Mono', monospace; }
    </style>
</head>
<body class="bg-zinc-950 text-zinc-100 min-h-screen flex flex-col selection:bg-emerald-500 selection:text-black">
    
    <!-- Top Navigation Bar -->
    <header class="border-b border-zinc-800/80 bg-zinc-900/50 backdrop-blur sticky top-0 z-50">
        <div class="max-w-4xl mx-auto px-4 h-14 flex items-center justify-between">
            <a href="https://placekwlb.github.io/" class="inline-flex items-center gap-2 text-sm font-medium text-zinc-400 hover:text-white transition-colors">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"/></svg>
                <span>Strona główna</span>
            </a>
            <span class="text-xs font-mono text-emerald-400 bg-emerald-500/10 px-2.5 py-1 rounded-full border border-emerald-500/20">SeedGen BIP-39</span>
        </div>
    </header>

    <!-- Main Content -->
    <main class="max-w-4xl mx-auto px-4 py-8 flex-1 w-full flex flex-col justify-center">
        <div class="mb-8 text-center">
            <h1 class="text-2xl font-bold tracking-tight mb-2">Generator Fraz Seed</h1>
            <p class="text-zinc-400 text-sm">Bezpieczne generowanie mnemoników BIP-39 lokalnie w przeglądarce.</p>
        </div>

        <div class="bg-zinc-900/60 border border-zinc-800/80 rounded-2xl p-6 max-w-xl mx-auto w-full">
            <div class="flex justify-between items-center mb-4">
                <span class="text-xs font-mono text-zinc-400 uppercase tracking-wider">Fraza mnemoniczna (12 słów)</span>
                <button id="generateBtn" class="px-3 py-1.5 bg-emerald-500 hover:bg-emerald-400 text-zinc-950 font-semibold rounded-lg text-xs transition-colors font-mono cursor-pointer">
                    Wygeneruj nową
                </button>
            </div>
            
            <div id="seedOutput" class="grid grid-cols-3 gap-2 p-4 bg-zinc-950 border border-zinc-800 rounded-xl font-mono text-sm text-zinc-200 mb-4 min-h-[140px] items-center text-center">
                <span class="text-zinc-600 col-span-3">Kliknij przycisk powyżej...</span>
            </div>

            <button id="copyBtn" class="w-full py-2.5 bg-zinc-800 hover:bg-zinc-700 text-zinc-200 font-medium rounded-xl text-sm transition-colors font-mono cursor-pointer">
                Kopiuj do schowka
            </button>
        </div>
    </main>

    <footer class="border-t border-zinc-900 py-6 text-center text-xs text-zinc-600 font-mono">
        Michał Plata &copy; 2026
    </footer>

    <script>
        // Prosta lista słów testowych BIP-39 (uproszczony przykład)
        const wordlist = [
            "abandon", "ability", "able", "about", "above", "absent", "absorb", "abstract", "absurd", "abuse", "access", "accident",
            "account", "accuse", "achieve", "acid", "acoustic", "acquire", "across", "act", "action", "actor", "actress", "actual",
            "adapt", "add", "addict", "address", "adjust", "admit", "adult", "advance", "advice", "aerobic", "affair", "afford",
            "afraid", "again", "age", "agent", "agree", "ahead", "aim", "air", "airport", "aisle", "alarm", "album", "alcohol",
            "alert", "alien", "all", "alley", "allow", "almost", "alone", "alpha", "already", "also", "alter", "always"
        ];

        function generateSeed() {
            let seed = [];
            for (let i = 0; i < 12; i++) {
                const randomIndex = Math.floor(Math.random() * wordlist.length);
                seed.push(wordlist[randomIndex]);
            }

            const output = document.getElementById('seedOutput');
            output.innerHTML = seed.map((word, index) => `
                <div class="bg-zinc-900 p-2 rounded border border-zinc-800/50 flex items-center gap-2">
                    <span class="text-[10px] text-zinc-500">${index + 1}.</span>
                    <span class="font-medium text-emerald-400">${word}</span>
                </div>
            `).join('');
            
            output.dataset.raw = seed.join(' ');
        }

        document.getElementById('generateBtn').addEventListener('click', generateSeed);
        document.getElementById('copyBtn').addEventListener('click', () => {
            const output = document.getElementById('seedOutput');
            if (output.dataset.raw) {
                navigator.clipboard.writeText(output.dataset.raw);
                alert('Skopiowano frazę seed do schowka!');
            }
        });

        generateSeed();
    </script>
</body>
</html>
